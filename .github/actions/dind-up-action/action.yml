name: "Start DinD (exec-root on disk)"
description: "Launch docker:dind bound to TCP and wait until healthy; moves exec-root off /run for tiny-/run environments."
author: "you"

inputs:
  container-name:
    description: "Name for the DinD container"
    default: dind-daemon
  bind-address:
    description: "Host address to bind dockerd TCP"
    default: 127.0.0.1
  port:
    description: "Dockerd TCP port"
    default: "2375"
  storage-volume:
    description: "Named volume for /var/lib/docker (images/layers)"
    default: dind-storage
  execroot-volume:
    description: "Named volume for /execroot (dockerd runtime state)"
    default: dind-execroot
  tmpfs-run-size:
    description: "Size of /run tmpfs inside DinD"
    default: 1g
  tmpfs-varrun-size:
    description: "Size of /var/run tmpfs inside DinD"
    default: 1g
  storage-driver:
    description: "Docker storage driver"
    default: overlay2
  health-interval:
    description: "Container healthcheck interval"
    default: 2s
  health-retries:
    description: "Container healthcheck retries"
    default: "60"
  health-start-period:
    description: "Container healthcheck start period"
    default: 10s
  wait-timeout:
    description: "Seconds to wait for DinD to become healthy"
    default: "180"
  additional-dockerd-args:
    description: "Extra args appended to dockerd (optional)"
    default: ""

outputs:
  docker-host:
    description: "DOCKER_HOST to use for subsequent steps"
    value: ${{ steps.set-env.outputs.docker_host }}

runs:
  using: "composite"
  steps:
    - name: Check space and inodes
      shell: bash
      run: |
        echo "== df -h /run ==" && df -h /run || true
        echo "== df -i /run (inodes) ==" && df -i /run || true

    - name: Start docker:dind
      shell: bash
      run: |
        docker rm -f "${{ inputs.container-name }}" 2>/dev/null || true
        docker run -d --privileged --name "${{ inputs.container-name }}" \
          --cgroupns=host \
          -e DOCKER_TLS_CERTDIR= \
          -p ${{ inputs.bind-address }}:${{ inputs.port }}:${{ inputs.port }} \
          -v "${{ inputs.storage-volume }}:/var/lib/docker" \
          -v "${{ inputs.execroot-volume }}:/execroot" \
          --tmpfs /run:rw,exec,size=${{ inputs.tmpfs-run-size }} \
          --tmpfs /var/run:rw,exec,size=${{ inputs.tmpfs-varrun-size }} \
          --health-cmd='docker info > /dev/null' \
          --health-interval=${{ inputs.health-interval }} \
          --health-retries=${{ inputs.health-retries }} \
          --health-start-period=${{ inputs.health-start-period }} \
          docker:dind \
            --host=tcp://0.0.0.0:${{ inputs.port }} \
            --host=unix:///var/run/docker.sock \
            --storage-driver=${{ inputs.storage-driver }} \
            --exec-root=/execroot ${{ inputs.additional-dockerd-args }}

    - id: set-env
      name: Export DOCKER_HOST
      shell: bash
      run: |
        echo "DOCKER_HOST=tcp://${{ inputs.bind-address }}:${{ inputs.port }}" >> "$GITHUB_ENV"
        echo "docker_host=tcp://${{ inputs.bind-address }}:${{ inputs.port }}" >> "$GITHUB_OUTPUT"

    - name: Wait for DinD (and show logs if it fails)
      shell: bash
      run: |
        echo -n "Waiting for Docker-in-Docker"
        if ! timeout ${{ inputs.wait-timeout }}s bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "${{ inputs.container-name }}" 2>/dev/null)" = "healthy" ]; do echo -n "."; sleep 2; done'; then
          echo
          echo "=== dind logs ==="
          docker logs "${{ inputs.container-name }}" || true
          exit 1
        fi
        echo
        docker -H "tcp://${{ inputs.bind-address }}:${{ inputs.port }}" info
