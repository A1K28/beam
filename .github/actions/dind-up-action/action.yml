name: "Start DinD (exec-root on disk)"
description: "Launch docker:dind on TCP and wait until ready; moves exec-root off /run."
runs:
  using: "composite"
  steps:
    - name: Check space and inodes
      shell: bash
      run: |
        echo "== df -h /run ==" && df -h /run || true
        echo "== df -i /run (inodes) ==" && df -i /run || true

    - name: Start docker:dind
      shell: bash
      run: |
        NAME="${{ inputs.container-name || 'dind-daemon' }}"
        BIND="${{ inputs.bind-address || '127.0.0.1' }}"
        PORT="${{ inputs.port || '2375' }}"
        SD="${{ inputs.storage-driver || 'overlay2' }}"
        TRS="${{ inputs.tmpfs-run-size || '1g' }}"
        TVRS="${{ inputs.tmpfs-varrun-size || '1g' }}"
        HI="${{ inputs.health-interval || '2s' }}"
        HR="${{ inputs.health-retries || '60' }}"
        HSP="${{ inputs.health-start-period || '10s' }}"
        EXTRA="${{ inputs.additional-dockerd-args }}"
        docker rm -f "$NAME" 2>/dev/null || true
        docker run -d --privileged --name "$NAME" \
          --cgroupns=host \
          -e DOCKER_TLS_CERTDIR= \
          -p ${BIND}:${PORT}:${PORT} \
          -v "${{ inputs.storage-volume || 'dind-storage' }}:/var/lib/docker" \
          -v "${{ inputs.execroot-volume || 'dind-execroot' }}:/execroot" \
          --tmpfs /run:rw,exec,size=${TRS} \
          --tmpfs /var/run:rw,exec,size=${TVRS} \
          --health-cmd='docker info > /dev/null' \
          --health-interval=${HI} \
          --health-retries=${HR} \
          --health-start-period=${HSP} \
          docker:dind \
            --host=tcp://0.0.0.0:${PORT} \
            --host=unix:///var/run/docker.sock \
            --storage-driver=${SD} \
            --exec-root=/execroot ${EXTRA}

    - name: Wait for DinD (TCP probe; show logs if it fails)
      shell: bash
      run: |
        NAME="${{ inputs.container-name || 'dind-daemon' }}"
        HOST="${{ inputs.bind-address || '127.0.0.1' }}"
        PORT="${{ inputs.port || '2375' }}"
        TIMEOUT="${{ inputs.wait-timeout || '180' }}"
        echo -n "Waiting for Docker-in-Docker"
        if ! timeout ${TIMEOUT}s bash -c 'until docker -H "tcp://'"${HOST}"':'"${PORT}"'" info >/dev/null 2>&1; do echo -n "."; sleep 2; done'; then
          echo
          echo "=== dind logs ==="
          # Use host daemon explicitly for logs
          docker -H unix:///var/run/docker.sock logs "$NAME" || true
          exit 1
        fi
        echo
        docker -H "tcp://${HOST}:${PORT}" info
    
    - id: set-output
      shell: bash
      run: |
        HOST="${{ inputs.bind-address || '127.0.0.1' }}"
        PORT="${{ inputs.port || '2375' }}"
        echo "docker_host=tcp://${HOST}:${PORT}" >> "$GITHUB_OUTPUT"

    - id: maybe-export
      if: ${{ inputs.export-gh-env == 'true' }}
      shell: bash
      run: |
        echo "DOCKER_HOST=${{ steps.set-output.outputs.docker_host }}" >> "$GITHUB_ENV"

inputs:
  container-name:
    default: dind-daemon
  bind-address:
    default: 127.0.0.1
  port:
    default: "2375"
  storage-volume:
    default: dind-storage
  execroot-volume:
    default: dind-execroot
  tmpfs-run-size:
    default: 1g
  tmpfs-varrun-size:
    default: 1g
  storage-driver:
    default: overlay2
  health-interval:
    default: 2s
  health-retries:
    default: "60"
  health-start-period:
    default: 10s
  wait-timeout:
    default: "180"
  additional-dockerd-args:
    default: ""
  export-gh-env:
    description: "Also write DOCKER_HOST to $GITHUB_ENV for the rest of the job"
    default: "false"

outputs:
  docker-host:
    value: ${{ steps.set-output.outputs.docker_host }}