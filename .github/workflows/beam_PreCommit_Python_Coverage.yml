name: PreCommit Python Coverage
on:
  pull_request_target:
    branches: [ "master", "release-*" ]
    paths: [ "model/**","sdks/python/**","release/**", 'release/trigger_all_tests.json', '.github/trigger_files/beam_PreCommit_Python_Coverage.json']
  issue_comment:
    types: [created]
  push:
    tags: ['v*']
    branches: ['master', 'release-*']
    paths: [ "model/**","sdks/python/**","release/**", ".github/workflows/beam_PreCommit_Python_Coverage.yml"]
  schedule:
    - cron: '45 2/6 * * *'
  workflow_dispatch:

#Setting explicit permissions for the action to avoid the default permissions which are `write-all` in case of pull_request_target event
permissions:
  actions: write
  pull-requests: write
  checks: write
  contents: read
  deployments: read
  id-token: none
  issues: write
  discussions: read
  packages: read
  pages: read
  repository-projects: read
  security-events: read
  statuses: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.issue.number || github.event.pull_request.head.label || github.sha || github.head_ref || github.ref }}-${{ github.event.schedule || github.event.comment.id || github.event.sender.login }}'
  cancel-in-progress: true

env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GE_CACHE_USERNAME }}
  GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GE_CACHE_PASSWORD }}
  HF_INFERENCE_TOKEN: ${{ secrets.HF_INFERENCE_TOKEN }}


jobs:
  beam_PreCommit_Python_Coverage:
    name: ${{ matrix.job_name }} (${{ matrix.job_phrase }})
    runs-on: [main]
    strategy:
      matrix:
        job_name: [beam_PreCommit_Python_Coverage]
        job_phrase: [Run Python_Coverage PreCommit]
    timeout-minutes: 180
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'schedule' && github.repository == 'apache/beam') ||
      github.event_name == 'workflow_dispatch' ||
      github.event.comment.body == 'Run Python_Coverage PreCommit'
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository
        uses: ./.github/actions/setup-action
        with:
          comment_phrase: ${{ matrix.job_phrase }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_job: ${{ matrix.job_name }} (${{ matrix.job_phrase }})

      - name: Setup environment
        uses: ./.github/actions/setup-environment-action
        with:
          java-version: default
          python-version: default

      # 1) Start DinD with larger /run and /var/run (keeps containerd happy)
      - uses: ./.github/actions/dind-up-action
        id: dind
        with:
          use-host-network: "true"
          tmpfs-run-size: 4g
          tmpfs-varrun-size: 8g
          export-gh-env: true

      # 2) Quick ping to confirm DinD is reachable
      - name: Quick ping to DinD
        env:
          DOCKER_HOST: ${{ steps.dind.outputs.docker-host }}
        run: docker info --format 'Daemon OK → OS={{.OperatingSystem}} RootDir={{.DockerRootDir}}'

      # 3) (Optional but helpful) clean DinD before tests to avoid ENOSPC/inodes
      - name: DinD cleanup
        run: |
          docker -H ${{ steps.dind.outputs.docker-host }} system prune -af --volumes || true
          docker -H ${{ steps.dind.outputs.docker-host }} image prune -af || true

      - name: Pre-test probe DinD
        run: |
          docker -H ${{ steps.dind.outputs.docker-host }} run --rm alpine echo OK

      - name: Prime Ryuk (avoid parallel race)
        env:
          DOCKER_HOST: ${{ steps.dind.outputs.docker-host }}
        run: |
          # make sure testcontainers is available in this step
          python -m pip install -q --upgrade pip testcontainers
          # pull something tiny so the prime is fast/stable
          docker -H ${{ steps.dind.outputs.docker-host }} pull alpine:3.19
          # start/stop any container via testcontainers → Ryuk starts once
          python - <<'PY'
          from testcontainers.core.container import DockerContainer
          c = DockerContainer("alpine:3.19").with_command("true")
          c.start(); c.stop()
          print("Ryuk primed")
          PY

      #################################################
      # Show which Docker we’ll use and basic health
      - name: DinD info
        run: |
          echo "Runner DOCKER_HOST=${DOCKER_HOST:-<empty>}"
          echo "DinD DOCKER_HOST=${{ steps.dind.outputs.docker-host }}"
          docker -H ${{ steps.dind.outputs.docker-host }} info --format 'ServerVersion={{.ServerVersion}} RootDir={{.DockerRootDir}}'

      # Get the DinD container IP (needed when using DinD over TCP)
      - name: Discover DinD IP
        env:
          DOCKER_HOST: unix:///var/run/docker.sock   # talk to the host daemon
        run: |
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' dind-daemon)
          echo "DIND_IP=$ip"
          echo "DIND_IP=$ip" >> $GITHUB_ENV

      # Smoke test plain Docker port mapping via DinD (no Testcontainers yet)
      - name: Port mapping smoke test (redis via plain docker)
        env:
          DOCKER_HOST: ${{ steps.dind.outputs.docker-host }}
        run: |
          docker pull redis:7.2.4
          cid=$(docker run -d -p 0:6379 --name redis-smoke redis:7.2.4)
          hostport=$(docker port redis-smoke 6379/tcp | sed 's/.*://')
          echo "REDIS_HOSTPORT=$hostport"
          # Try TCP connect from the runner to DinD's IP:hostport
          timeout 5 bash -lc 'exec 3<>/dev/tcp/$DIND_IP/'"$hostport" '&& echo tcp-ok || (echo tcp-fail; exit 1)'
          docker rm -f "$cid"

      # Testcontainers check (runner Python): start/stop a tiny container using the right overrides
      - name: Testcontainers self-check (runner)
        env:
          DOCKER_HOST: ${{ steps.dind.outputs.docker-host }}
          TESTCONTAINERS_HOST_OVERRIDE: ${{ env.DIND_IP }}
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/docker.sock"
        run: |
          python -m pip install -q --upgrade pip testcontainers
          docker -H ${{ steps.dind.outputs.docker-host }} pull alpine:3.19
          python - <<'PY'
          from testcontainers.core.waiting_utils import config
          print("TC(waiting) runner:", config.timeout, config.max_tries, config.sleep_time)
          from testcontainers.core.container import DockerContainer
          c = DockerContainer("alpine:3.19").with_command("true")
          c.start(); c.stop()
          print("TC(container) runner: ok")
          PY
          # Show a Ryuk if started during the check (not required, just informative)
          docker -H ${{ steps.dind.outputs.docker-host }} ps -a --filter name=testcontainers-ryuk || true

      # Create the tox env only (no tests), then run the same TC check INSIDE the venv
      - name: Create tox env only (no tests)
        run: |
          python -m pip install -q tox
          tox -e py39-cloudcoverage --notest -vv

      - name: Testcontainers self-check (inside tox venv)
        env:
          DOCKER_HOST: ${{ steps.dind.outputs.docker-host }}
          TESTCONTAINERS_HOST_OVERRIDE: ${{ env.DIND_IP }}
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/docker.sock"
          TC_TIMEOUT: "120"
          TC_MAX_TRIES: "120"
          TC_SLEEP_TIME: "1"
        run: |
          tox -e py39-cloudcoverage -- python - <<'PY'
          from testcontainers.core.waiting_utils import config
          print("TC(waiting) tox:", config.timeout, config.max_tries, config.sleep_time)
          from testcontainers.core.container import DockerContainer
          c = DockerContainer("alpine:3.19").with_command("true")
          c.start(); c.stop()
          print("TC(container) tox: ok")
          PY

      #################################################

      # Quick probe: what are the current Testcontainers timeouts?
      - name: Probe Testcontainers waiting config
        env:
          DOCKER_HOST: ${{ steps.dind.outputs.docker-host }}
        run: |
          python - <<'PY'
          from testcontainers.core.waiting_utils import config
          print("TC timeout:", config.timeout, "max_tries:", config.max_tries, "sleep_time:", config.sleep_time)
          PY

      # 4) Run tests
      - name: Run preCommitPyCoverage
        env:
          DOCKER_HOST: ${{ steps.dind.outputs.docker-host }}
          TOX_TESTENV_PASSENV: "DOCKER_*,TESTCONTAINERS_*"
          # Ryuk ON (omit entirely or set to "false")
          TESTCONTAINERS_RYUK_DISABLED: "false"
          # Optional: some CI needs privileged Ryuk
          # TESTCONTAINERS_RYUK_CONTAINER_PRIVILEGED: "true"
          PYTEST_ADDOPTS: "--dist=loadfile -n 4"
        uses: ./.github/actions/gradle-command-self-hosted-action
        with:
          gradle-command: :sdks:python:test-suites:tox:py39:preCommitPyCoverage

      # 5) (Debug-only) prove which daemon tests used, no repo edits needed
      - name: Sanity which Docker did tox hit?
        if: always()
        run: |
          echo "Outer DOCKER_HOST=${{ steps.dind.outputs.docker-host }}"
          # Show DinD load to confirm tests actually used it
          docker -H ${{ steps.dind.outputs.docker-host }} system df -v || true

      - uses: codecov/codecov-action@v3
        with:
          flags: python
          directory: sdks/python
      - name: Archive Python Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Python Test Results
          path: '**/pytest*.xml'
      - name: Publish Python Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          commit: '${{ env.prsha || env.GITHUB_SHA }}'
          comment_mode: ${{ github.event_name == 'issue_comment'  && 'always' || 'off' }}
          files: '**/pytest*.xml'
          large_files: true